<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz d'orientation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 36px 40px;
      width: 420px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .icon {
      width: 40px;
      height: 40px;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.3px;
    }

    .question {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 14px;
      background: #f9fafb;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option:hover {
      background: #f3f4f6;
    }

    .radio {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-label {
      font-size: 18px;
      color: #374151;
      font-weight: 500;
    }

    /* Selected option styling */
    .option.selected {
      background: #fef2f2;
      border: 2px solid #f87171;
    }

    .option.selected .radio {
      border: none;
      background: #dc2626;
    }

    .option.selected .option-label {
      color: #1f2937;
      font-weight: 600;
    }

    /* Bounce animation for selected option */
    @keyframes subtleBounce {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.01);
      }
    }

    .option.selected {
      animation: subtleBounce 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <svg class="icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Graduation cap icon -->
        <path d="M20 8L4 16L20 24L36 16L20 8Z" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M10 20V28C10 28 14 32 20 32C26 32 30 28 30 28V20" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M36 16V26" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Decorative dots on top -->
        <circle cx="16" cy="6" r="1.5" fill="#dc2626"/>
        <circle cx="20" cy="4" r="1.5" fill="#dc2626"/>
        <circle cx="24" cy="6" r="1.5" fill="#dc2626"/>
      </svg>
      <h1 class="title">Quiz d'orientation</h1>
    </div>

    <!-- Question -->
    <p class="question">Quel est votre niveau ?</p>

    <!-- Options -->
    <div class="options">
      <div class="option">
        <div class="radio"></div>
        <span class="option-label">Débutant</span>
      </div>

      <div class="option selected">
        <div class="radio"></div>
        <span class="option-label">Intermédiaire</span>
      </div>

      <div class="option">
        <div class="radio"></div>
        <span class="option-label">Expert</span>
      </div>
    </div>
  </div>
</body>
</html>
