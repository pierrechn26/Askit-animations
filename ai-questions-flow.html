<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dynamic Questions Flow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 20px;
    }

    /* Loading dots blink animation */
    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .dot-1 { animation: blink 1.5s ease-in-out infinite; animation-delay: 0s; }
    .dot-2 { animation: blink 1.5s ease-in-out infinite; animation-delay: 0.3s; }
    .dot-3 { animation: blink 1.5s ease-in-out infinite; animation-delay: 0.6s; }

    /* Glow pulse animation for light traveling effect */
    @keyframes glowPulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Card shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
        </filter>

        <!-- Center block shadow -->
        <filter id="centerShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
        </filter>

        <!-- Glow filter for light effect -->
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Green arrow marker -->
        <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#22c55e"/>
        </marker>

        <!-- Red arrow marker -->
        <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#ef4444"/>
        </marker>

        <!-- Path for input line (left to center) -->
        <path id="inputPath" d="M 248 195 C 290 195, 320 185, 355 185" fill="none"/>

        <!-- Path for output line (center to question 2b) -->
        <path id="outputPath" d="M 445 195 C 500 195, 530 205, 595 205" fill="none"/>
      </defs>

      <!-- ========== LEFT CARD - Question 1 ========== -->
      <g transform="translate(20, 50)">
        <rect width="230" height="290" rx="14" fill="white" filter="url(#shadow)"/>

        <!-- Green dot + title -->
        <circle cx="22" cy="28" r="5" fill="#22c55e"/>
        <text x="36" y="32" font-size="13" fill="#6b7280" font-weight="500">question 1</text>

        <!-- Placeholder lines -->
        <rect x="18" y="52" width="195" height="8" rx="4" fill="#e5e7eb"/>
        <rect x="18" y="68" width="170" height="8" rx="4" fill="#e5e7eb"/>
        <rect x="18" y="84" width="140" height="8" rx="4" fill="#e5e7eb"/>
        <rect x="18" y="100" width="110" height="8" rx="4" fill="#e5e7eb"/>

        <!-- Radio options -->
        <g transform="translate(18, 125)">
          <!-- Option 1 -->
          <rect width="195" height="36" rx="6" fill="#f9fafb"/>
          <circle cx="20" cy="18" r="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
          <rect x="38" y="12" width="130" height="10" rx="5" fill="#e5e7eb"/>

          <!-- Option 2 -->
          <rect y="44" width="195" height="36" rx="6" fill="#f9fafb"/>
          <circle cx="20" cy="62" r="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
          <rect x="38" y="56" width="110" height="10" rx="5" fill="#e5e7eb"/>

          <!-- Option 3 -->
          <rect y="88" width="195" height="36" rx="6" fill="#f9fafb"/>
          <circle cx="20" cy="106" r="8" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
          <rect x="38" y="100" width="145" height="10" rx="5" fill="#e5e7eb"/>
        </g>
      </g>

      <!-- ========== CENTER BLOCK - AI ========== -->
      <g transform="translate(355, 140)">
        <!-- Loading dots -->
        <circle class="dot-1" cx="32" cy="-18" r="4.5" fill="#d1d5db"/>
        <circle class="dot-2" cx="45" cy="-18" r="4.5" fill="#9ca3af"/>
        <circle class="dot-3" cx="58" cy="-18" r="4.5" fill="#6b7280"/>

        <!-- Main block -->
        <rect width="90" height="90" rx="16" fill="#1a1a1a" filter="url(#centerShadow)"/>

        <!-- OpenAI Logo -->
        <g transform="translate(45, 45)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"/>
          <path d="M0,-18 L0,-7"/>
          <path d="M15.6,-9 L5.5,-3.5"/>
          <path d="M15.6,9 L5.5,3.5"/>
          <path d="M0,18 L0,7"/>
          <path d="M-15.6,9 L-5.5,3.5"/>
          <path d="M-15.6,-9 L-5.5,-3.5"/>
          <path d="M0,-7 L5.5,-3.5 L5.5,3.5 L0,7 L-5.5,3.5 L-5.5,-3.5 Z"/>
        </g>
      </g>

      <!-- ========== CONNECTION LINES ========== -->

      <!-- Input line (left to center) - green dashed -->
      <path
        d="M 248 195 C 290 195, 320 185, 355 185"
        fill="none"
        stroke="#22c55e"
        stroke-width="1.8"
        stroke-dasharray="6 4"
        marker-end="url(#arrowGreen)"
      />

      <!-- Light glow traveling on input line -->
      <circle r="6" fill="#22c55e" filter="url(#glow)" opacity="0.8">
        <animateMotion dur="3s" repeatCount="indefinite">
          <mpath href="#inputPath"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Output line to 2a (red dotted) -->
      <path
        d="M 445 165 C 490 140, 530 95, 595 75"
        fill="none"
        stroke="#ef4444"
        stroke-width="1.5"
        stroke-dasharray="5 5"
        marker-end="url(#arrowRed)"
      />

      <!-- Output line to 2b (green dotted) - animated -->
      <path
        d="M 445 195 C 500 195, 530 205, 595 205"
        fill="none"
        stroke="#22c55e"
        stroke-width="1.8"
        stroke-dasharray="6 4"
        marker-end="url(#arrowGreen)"
      />

      <!-- Light glow traveling on output line -->
      <circle r="6" fill="#22c55e" filter="url(#glow)" opacity="0.8">
        <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s">
          <mpath href="#outputPath"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </circle>

      <!-- Output line to 2c (red dotted) -->
      <path
        d="M 445 220 C 490 250, 530 295, 595 320"
        fill="none"
        stroke="#ef4444"
        stroke-width="1.5"
        stroke-dasharray="5 5"
        marker-end="url(#arrowRed)"
      />

      <!-- ========== RIGHT CARDS ========== -->

      <!-- Question 2a (rejected) -->
      <g transform="translate(595, 30)">
        <rect width="220" height="115" rx="10" fill="white" filter="url(#shadow)"/>

        <!-- Red dot + title -->
        <circle cx="18" cy="22" r="4" fill="#ef4444"/>
        <text x="30" y="26" font-size="11" fill="#6b7280" font-weight="500">question 2a</text>

        <!-- X icon -->
        <g transform="translate(198, 18)">
          <circle r="9" fill="#fef2f2"/>
          <path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- Content lines -->
        <rect x="15" y="42" width="160" height="6" rx="3" fill="#e5e7eb"/>
        <rect x="15" y="54" width="130" height="6" rx="3" fill="#e5e7eb"/>

        <!-- Two boxes -->
        <rect x="15" y="72" width="90" height="32" rx="5" fill="#f3f4f6"/>
        <rect x="115" y="72" width="90" height="32" rx="5" fill="#f3f4f6"/>
      </g>

      <!-- Question 2b (selected) -->
      <g transform="translate(595, 155)">
        <rect width="220" height="115" rx="10" fill="white" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>

        <!-- Green dot + title -->
        <circle cx="18" cy="22" r="4" fill="#22c55e"/>
        <text x="30" y="26" font-size="11" fill="#6b7280" font-weight="500">question 2b</text>

        <!-- Checkmark icon -->
        <g transform="translate(198, 18)">
          <circle r="9" fill="#dcfce7"/>
          <path d="M-3,0 L-1,3 L4,-3" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- Content lines -->
        <rect x="15" y="42" width="170" height="6" rx="3" fill="#e5e7eb"/>
        <rect x="15" y="54" width="140" height="6" rx="3" fill="#e5e7eb"/>

        <!-- Two green boxes -->
        <rect x="15" y="72" width="90" height="32" rx="5" fill="#dcfce7"/>
        <rect x="115" y="72" width="90" height="32" rx="5" fill="#dcfce7"/>
      </g>

      <!-- Question 2c (rejected) -->
      <g transform="translate(595, 280)">
        <rect width="220" height="115" rx="10" fill="white" filter="url(#shadow)"/>

        <!-- Red dot + title -->
        <circle cx="18" cy="22" r="4" fill="#ef4444"/>
        <text x="30" y="26" font-size="11" fill="#6b7280" font-weight="500">question 2c</text>

        <!-- X icon -->
        <g transform="translate(198, 18)">
          <circle r="9" fill="#fef2f2"/>
          <path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- Content lines -->
        <rect x="15" y="42" width="150" height="6" rx="3" fill="#e5e7eb"/>
        <rect x="15" y="54" width="120" height="6" rx="3" fill="#e5e7eb"/>

        <!-- Two boxes -->
        <rect x="15" y="72" width="90" height="32" rx="5" fill="#f3f4f6"/>
        <rect x="115" y="72" width="90" height="32" rx="5" fill="#f3f4f6"/>
      </g>

    </svg>
  </div>
</body>
</html>
